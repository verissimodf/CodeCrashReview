name: codecrashreview
services:
  validator:
    build:
      context: .
      dockerfile: deploy/validator/Dockerfile
    environment:
      VALIDATOR_HOST_ROOT: ${HOME}/.local/share/codecrashreview/validator-jobs
      VALIDATOR_IMAGE: ${VALIDATOR_IMAGE:?Set immutable Go validator image digest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/.local/share/codecrashreview/validator-jobs:/jobs
      - validator-socket:/socket
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 32
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    volumes:
      - redisdata:/data
    networks: [data]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
      target: production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?}
      FREELLM_BASE_URL: http://127.0.0.1:8082/v1
      FREELLM_UNIX_SOCKET: /run/codecrash/freellm.sock
      FREELLM_API_KEY: ${FREELLM_API_KEY:?}
      DEFAULT_MODEL: ${DEFAULT_MODEL:?}
      REVIEW_WORKSPACE_ROOT: /var/lib/codecrashreview/reviews
      REVIEW_LOCAL_ROOTS: /repositories
      REVIEW_MAX_FILES: ${REVIEW_MAX_FILES:-20}
      REVIEW_MAX_BYTES: ${REVIEW_MAX_BYTES:-6144}
      REVIEW_TIMEOUT: ${REVIEW_TIMEOUT:-0}
      REVIEW_VALIDATOR_SOCKET: /run/validator/validator.sock
      GIN_MODE: release
    volumes:
      - ${HOME}/.local/share/codecrashreview/proxy:/run/codecrash:ro
      - ${HOME}/.local/share/codecrashreview/reviews:/var/lib/codecrashreview/reviews
      - /opt/laytech-ai/repositories:/repositories:ro
      - validator-socket:/run/validator:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [data, app]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      target: production
    depends_on:
      backend: {condition: service_healthy}
    networks:
      app:
      ingress:
        aliases: [codecrash-frontend]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped
networks:
  data: {internal: true}
  app: {}
  ingress: {external: true, name: CNC_APP_PROD_01}
volumes:
  validator-socket: {}
  pgdata: {}
  redisdata: {}
