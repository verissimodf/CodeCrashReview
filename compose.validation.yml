name: codecrashreview-validation
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: [redisdata:/data]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  validator:
    build: {context: ., dockerfile: deploy/validator/Dockerfile}
    environment:
      VALIDATOR_HOST_ROOT: /jobs
      VALIDATOR_IMAGE: ${VALIDATOR_IMAGE}
      VALIDATOR_PYTHON_IMAGE: ${VALIDATOR_PYTHON_IMAGE}
      VALIDATOR_NODE_IMAGE: ${VALIDATOR_NODE_IMAGE}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - jobs:/jobs
      - validator-socket:/socket
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 32
  backend:
    build: {context: ./backend, target: production}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      FREELLM_BASE_URL: ${FREELLM_BASE_URL}
      FREELLM_API_KEY: ${FREELLM_API_KEY}
      DEFAULT_MODEL: ${DEFAULT_MODEL}
      REVIEW_WORKSPACE_ROOT: /var/lib/codecrashreview/reviews
      REVIEW_LOCAL_ROOTS: /repositories
      REVIEW_TIMEOUT: ${REVIEW_TIMEOUT:-0}
      REVIEW_OPERATOR_IDS: ${REVIEW_OPERATOR_IDS:-}
      REVIEW_VALIDATOR_SOCKET: /run/validator/validator.sock
      GIN_MODE: release
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - reviews:/var/lib/codecrashreview/reviews
      - repositories:/repositories:ro
      - validator-socket:/run/validator:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [data, app]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
  frontend:
    build: {context: ./frontend, target: production}
    depends_on: {backend: {condition: service_healthy}}
    ports: ["127.0.0.1:${CCR_FRONTEND_PORT:-18080}:80"]
    networks: [app]
networks:
  data: {internal: true}
  app: {}
volumes:
  pgdata: {}
  redisdata: {}
  jobs: {}
  reviews: {}
  repositories: {}
  validator-socket: {}
