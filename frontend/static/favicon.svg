<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0d1117"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M 4 0 L 0 0 0 4" fill="none" stroke="#00ffff" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#grid)" opacity="0.5"/>

  <!-- Code brackets -->
  <g transform="translate(8, 8)">
    <!-- Left bracket -->
    <path d="M 2 2 L 6 2 M 6 2 L 6 14 M 6 14 L 2 14"
          stroke="#00ffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <animate attributeName="stroke" values="#00ffff;#ff00ff;#00ff87;#00ffff" dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- Right bracket -->
    <path d="M 14 2 L 10 2 M 10 2 L 10 14 M 10 14 L 14 14"
          stroke="#ff00ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <animate attributeName="stroke" values="#ff00ff;#00ff87;#00ffff;#ff00ff" dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- Center lightning -->
    <path d="M 9 5 L 8 9 L 10 9 L 9 13"
          stroke="#ffaa00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Glow effect -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <rect x="6" y="6" width="20" height="20" rx="4" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.5"/>
  </g>
</svg>