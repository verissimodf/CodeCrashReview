services:
  postgres:
    image: postgres:16-alpine
    container_name: codecrash-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codecrash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codecrash}
      POSTGRES_DB: ${POSTGRES_DB:-codecrash}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codecrash}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codecrash-network

  redis:
    image: redis:7-alpine
    container_name: codecrash-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codecrash-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: codecrash-backend
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-codecrash}:${POSTGRES_PASSWORD:-codecrash}@postgres:5432/${POSTGRES_DB:-codecrash}?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=24h
      - ARGON2_TIME=3
      - ARGON2_MEMORY=65536
      - ARGON2_THREADS=4
      - ARGON2_KEYLEN=32
      # FreeLLM-Local no host (acessível via host.docker.internal)
      - FREELLM_BASE_URL=http://host.docker.internal:8082/v1
      - FREELLM_API_KEY=ollama
      - DEFAULT_MODEL=${DEFAULT_MODEL:-codellama:34b}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - SANDBOX_NETWORK=codecrash-sandbox
      - SANDBOX_CPU_LIMIT=2
      - SANDBOX_MEMORY_LIMIT=2g
      - SANDBOX_PIDS_LIMIT=100
      - ELO_K_FACTOR=32
      - GLICKO_TAU=0.5
      - MATCH_TIMEOUT_SECONDS=300
      - QUEUE_CHECK_INTERVAL_MS=5000
      - GIN_MODE=release
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox_cache:/tmp/sandbox-cache
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codecrash-network
      - codecrash-sandbox
    restart: unless-stopped
    privileged: true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: codecrash-frontend
    environment:
      - PUBLIC_WS_URL=wss://codecrashreview.laytech.com.br/ws
      - PUBLIC_API_URL=https://codecrashreview.laytech.com.br/api
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    networks:
      - codecrash-network
    restart: unless-stopped

networks:
  codecrash-network:
    driver: bridge
  codecrash-sandbox:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  sandbox_cache:
